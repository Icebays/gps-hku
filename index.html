<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GPS-HKU · 3D Campus Guide</title>
<meta name="description" content="GPS-HKU — a 3D map, walking guide and floor plan guide to the University of Hong Kong.">
<meta name="theme-color" content="#0f4c3a">
<link rel="icon" href="assets/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="assets/app.css">
<script type="importmap">
{ "imports": {
  "three": "./vendor/three/three.module.min.js",
  "three/addons/": "./vendor/three/addons/"
} }
</script>
<script>
  try { const t = localStorage.getItem('gps-theme'); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
</script>
</head>
<body>
<header class="topbar">
  <button class="icon-btn menu-btn" id="menuBtn" aria-label="Menu">
    <svg viewBox="0 0 24 24" width="22" height="22"><path d="M3 6h18M3 12h18M3 18h18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
  </button>
  <a class="brand" href="#/">
    <img src="assets/icon.svg" alt="" width="28" height="28">
    <span>GPS-HKU</span>
  </a>
  <div class="search">
    <svg viewBox="0 0 24 24" width="16" height="16"><circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="2"/><path d="M20 20l-4-4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
    <input id="searchInput" type="search" autocomplete="off" data-i18n-placeholder="search">
    <kbd>/</kbd>
    <div class="search-results" id="searchResults" hidden></div>
  </div>
  <div class="top-actions">
    <a class="pill map-pill" href="#/map" data-i18n="openMap">3D Map</a>
    <button class="pill" id="langBtn" aria-label="Language">繁</button>
    <button class="icon-btn" id="themeBtn" aria-label="Theme">
      <svg viewBox="0 0 24 24" width="18" height="18"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z" fill="currentColor"/></svg>
    </button>
  </div>
</header>

<div class="layout">
  <nav class="sidebar" id="sidebar" aria-label="Chapters"></nav>
  <div class="scrim" id="scrim"></div>
  <main class="main" id="main">
    <article class="page" id="page"></article>
  </main>
  <aside class="toc" id="toc"></aside>
</div>

<script type="module" src="assets/app.js"></script>
</body>
</html>
